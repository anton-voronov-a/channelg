          "faqPage": {

              {
                "@type": "Question",
                "name": "How to start?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "1. Log into Google using the extension button next to the address bar. This way you can securely save the extension data on your Google drive. All functions, except synchronization with Google Drive, can work without logging into Google.\n2. Go to Your YouTube Subscriptions and follow the instructions in the panel that appears to help you group your channels. If you only need analytics, blocking videos on YouTube using a filter or sound effects, then you don’t need to configure anything else, everything will work even for anonymous YouTube users."
                }
              },
              {
                "@type": "Question",
                "name": "When do we need to replace audio or video for all videos in a channel?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "There are many music videos on YouTube without videos, you can replace the video to make it more enjoyable to watch all the videos from such channels. Some clips can be improved by replacing the sound. Create a group and specify your wishes in the video settings. Add any channel to this group and these settings will be applied to all videos of this channel."
                }
              },
              {
                "@type": "Question",
                "name": "How can you watch a lot of short YouTube videos quickly?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "This extension allows you to combine the found video from the subscription into playlists. Using playlists, you can simply watch all the videos at once, switching to them automatically, so you can save a lot of time. Open the Videos dialog in the extension's panel in your YouTube subscriptions. Find a video using the filter and click on the Create playlist button."
                }
              },
              {
                "@type": "Question",
                "name": "Where can I find high-quality preview images of YouTube videos?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "This extension allows you to display a list of videos from subscriptions, in which images are in high quality. Open the Videos dialog in the extension's panel in your YouTube subscriptions. And then all you have to do is right-click on the image and do whatever you want with it."
                }
              },
              {
                "@type": "Question",
                "name": "How do I mark YouTube channels as bad?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "For this opportunity to appear, you need to use this extension. As in the operating system, we use the trash bin for garbage. Likewise, for bad content, we can use the YouTube folder for trash. We need to create a folder for spam or junk and place the selected channels there. In other words, we need to group channels that we consider garbage. The name of this YouTube folder is located on the video viewing page, so by organizing channels in this way, you can immediately understand what quality this video is."
                }
              },
              {
                "@type": "Question",
                "name": "How can you save time watching videos?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "While watching videos, you often get enough information to save you time. You should not lose the information you receive. Typically, you need data to predict something. And data is the experience you get as a result of your viewing. At first glance, it may seem that by liking the clip you are doing something useful for yourself because you keep your impressions. But it will not help you much if you want to decide whether to watch a new clip from this channel or not.\nTo find a solution, you need to link your impressions to your subscription by grouping them with other channels. This will allow you to quickly find suitable clips and will save you time if you figure out which broadcasts are unnecessary for you. This extension allows you to achieve this goal by ranking and organizing YouTube channels.\nLet me show you an example. Let's say you are already subscribed to a channel that releases many new clips every day, but most of the clips do not interest you. You know that the program you want comes out once a week. You have to get a lot of extra videos six days a week for one show.\nThis extension gives you the ability to hide unnecessary items with one click. All you need is to add the channel to the YouTube folder and include it in the filter when you need it."
                }
              },
              {
                "@type": "Question",
                "name": "What do you do when you have a lot of elements?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "If we are talking about a file, then you usually put it in a folder. Let's imagine we have a lot of subscriptions. Have you seen a folder for them somewhere? In such cases, we can group subscriptions to create a hierarchical structure by organizing channels into categories (YouTube folders).\nThis application extends the capabilities of the YouTube subscription manager, which is available on the subscription management page, organizing channels using categories like folders. This feature is very similar to the YouTube collections removed in the last decade. But unlike collections, the data you create is stored on Google Drive, so you manage it. You can make a backup or sync with your computer just like a regular file on a Google drive. If you want, you can even see what's inside the file or delete it completely.\nIn addition to YouTube folders, this application also can manage subscriptions using the rating."
                }
              },
              {
                "@type": "Question",
                "name": "Why do we need a rating?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "With the help of YouTube folders, we can already filter subscriptions and give them meaning. But the information about the group when filtering does not provide such possibilities that the indication of a numerical value does.\nIf you filter subscriptions by group, then you simply click on the corresponding checkbox in the filter, and if you need a different category, then you are looking for another checkbox, it may be at the end of the tree or the beginning, therefore far from the previous one. Then you try to find the third group and again waste your time.\nIn the case of ranking, you change the minimum value of the channel rating in one place, and you do not need to search for the group checkbox inside the tree.\nFor example, you can give a higher rating to subscription, whose shows you always want to see, and a lower rating to those you can skip. Depending on how much time you have, you can simply change the minimum value with one button to see the programs for which you currently have time. If you have more time, then you can use the same button, which changes the minimum value.\nThe name of the Youtube folder helps you to use the desired topic when filtering, and the rating helps to limit the list of videos regardless of the topic.\nThis application can save links to comments."
                }
              },
              {
                "@type": "Question",
                "name": "Why do we need to link comments to a channel?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Now let's pretend that you recognize something in the video that characterizes the channel as a whole. For example, you saw that the video contains inappropriate behavior. In this case, you can of course finish watching and hope that in the future you will not be offered videos from this channel.\nLet's say you were out of luck and you again received a video from this channel, but you liked it. To save your time, you need to unsubscribe from part of YouTube subscriptions, and you are trying to figure out: do you need this channel."
                }
              },
              {
                "@type": "Question",
                "name": "How do you know if a channel is good or bad?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "It is necessary to leave written notes about the moments you liked and did not like.\nThis extension allows you to bind a YouTube comment to a channel. As a result, you will have a kind of editable channel dossier, consisting of the YouTube comments that you have chosen. These comments do not have to be written to yourself."
                }
              },
              {
                "@type": "Question",
                "name": "Why do we need to hide video and playlist thumbnails?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You need to hide the thumbnails of video channels and playlists in order to focus on useful information and not waste your time on something that is obviously unnecessary.\nWhen you go to the trending section on YouTube or search for something, you are offered a lot of videos from channels that you may not trust. If you do not trust these channels, you can hide a significant part of the information about them.\nHiding information can be done by placing the channel in a group, and in the group editor indicate that you want to hide the thumbnails. All channels from this group will be used to hide YouTube thumbnails."
                }
              },
              {
                "@type": "Question",
                "name": "Why do we need to skip the beginning of the video?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "This saves time. Often the first part of a YouTube video is used by bloggers for advertising. You can skip ads and immediately watch all the videos of this channel from an interesting moment. \nOn the video viewing page, click the edit button, turn on the advanced mode and set the number of seconds from which you want to start watching the video."
                }
